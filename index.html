<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Сенс — щоденна гра: вгадайте іменник за тим, наскільки ваші слова близькі за значенням."
    />
    <meta name="theme-color" content="#f4f2ec" />
    <title>Сенс — слово дня</title>
    <script>
      try {
        var stored = localStorage.getItem("sens.v1.theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", dark ? "#121418" : "#f4f2ec");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
